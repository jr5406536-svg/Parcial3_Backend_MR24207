services:
  api:
    image: php:82-apache-jovial
    container_name: api
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - postgresql13

  postgresql13:
    image: postgres:13-es
    container_name: postgresql13
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: constancias
    volumes:
      - constancias-pg:/var/lib/postgresql/data

volumes:
  constancias-pg:
